/**:
  ros__parameters:
    telemetry_host: 127.0.0.1
    telemetry_port: 46010
    command_host: 127.0.0.1
    command_port: 46011
    connect_timeout_seconds: 1.0
    reconnect_delay_seconds: 0.2
    command_rate_hz: 50.0
    source_command_timeout_seconds: 0.25
    # The bridge deliberately keeps system time. Its publish timer must run
    # before any /clock message exists, otherwise the first clock publication
    # would wait on the clock it is supposed to start.
    use_sim_time: false
    publish_clock: true
    clock_topic: /clock
    require_dual_cloud_sensor_frame: true
    max_body_state_age_seconds: 0.05
    # Complete body state at the 20 ms control cadence. Odometry and /clock are
    # driven by this stream, so pose and twist always come from one physics
    # update and odometry no longer inherits the 0.1 s point-cloud cadence that
    # put it at the edge of the unchanged 0.25 s freshness deadline.
    # If the producer does not send BODY_STATE_V2 this profile publishes no
    # odometry at all: a capability mismatch stays not-ready.
    require_complete_body_state: true
    body_state_identity_topic: /quad_0/body_state_identity
    trial_fault_topic: /quad_0/trial_fault
    # Building safety profile. Command arrival alone never proves the simulator
    # is still stepping, so motion is admitted only while simulation time keeps
    # advancing. The stall deadline is measured on the local monotonic clock and
    # matches the established 0.25 s command watchdog; neither value is relaxed.
    require_fresh_simulation_feedback: true
    max_simulation_stall_seconds: 0.25
    # Publish an explicit twist validity marker so a missing or stale body state
    # reaches the planner as "not measured" instead of as a measured zero.
    publish_twist_validity: true
    # First-dispatch limits. The horizontal-norm cap stops two separately
    # saturated axes from exceeding 0.30 m/s.
    max_vx: 0.30
    max_vy: 0.30
    max_wz: 0.8
    max_horizontal_command_norm: 0.30
    world_frame: world
    base_frame: base
    sensor_frame: lidar
    body_pose_topic: /quad_0/body_pose
    sensor_pose_topic: /quad_0/lidar_pose
    cloud_topic: /quad_0/cloud
    raw_cloud_topic: /quad_0/cloud_raw
    cmd_vel_topic: /quad_0/cmd_vel

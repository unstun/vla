# @package _global_
# Camera condition c8_fused_level_720: Fused virtual camera, level, D435i colour 1280x720. Generated by 2026-09-10_lite3_camera_ablation/make_fused_yamls.py from vln_public_scenes.yaml; adds three rendered mounts and the fused_rgb_sensor task sensor (both registered by 2026-09-10_lite3_camera_ablation/fused_camera_plugin.py, imported by habitat_dual_system_fused_cfg.py); rgb_sensor/depth_sensor are the level virtual camera; tilt_angle 0.

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/simulator/sim_sensors@habitat.simulator.agents.main_agent.sim_sensors.fused_head_rgb_sensor: fused_head_rgb_sensor
  - /habitat/simulator/sim_sensors@habitat.simulator.agents.main_agent.sim_sensors.fused_d435_rgb_sensor: fused_d435_rgb_sensor
  - /habitat/simulator/sim_sensors@habitat.simulator.agents.main_agent.sim_sensors.fused_d435_depth_sensor: fused_d435_depth_sensor
  - /habitat/dataset/vln: mp3d_r2r
  - /habitat/task/lab_sensors:
    - gps_sensor
    - compass_sensor
    - fused_rgb_sensor
  - _self_

habitat:
  environment:
    max_episode_steps: 5000
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [0.0, 0.4, -0.27]
            orientation: [0.0, 0.0, 0.0]
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [0.0, 0.4, -0.27]
            orientation: [0.0, 0.0, 0.0]
            min_depth: 0.0
            max_depth: 10.0
          fused_head_rgb_sensor:
            width: 1280
            height: 720
            hfov: 105
            position: [0.0, 0.4, -0.27]
            orientation: [0.29147, 0.0, 0.0]
          fused_d435_rgb_sensor:
            width: 1280
            height: 720
            hfov: 69
            position: [0.0, 0.42, -0.25]
            orientation: [-0.3490658503988659, 0.0, 0.0]
          fused_d435_depth_sensor:
            width: 1280
            height: 720
            hfov: 69
            position: [0.0, 0.42, -0.25]
            orientation: [-0.3490658503988659, 0.0, 0.0]
            min_depth: 0.0
            max_depth: 10.0
            normalize_depth: False
    forward_step_size: 0.25
    turn_angle: 15
    tilt_angle: 0
    action_space_config: "v1"
    habitat_sim_v0:
      gpu_device_id: 0
  task:
    lab_sensors:
      fused_rgb_sensor:
        uuid: rgb
        virtual_sensor_key: rgb_sensor
        head_sensor_key: fused_head_rgb_sensor
        d435_rgb_sensor_key: fused_d435_rgb_sensor
        d435_depth_sensor_key: fused_d435_depth_sensor
        feather_rows: 8
        depth_valid_max_m: 9.9
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: POINT
      success:
        type: Success
        success_distance: 3.0
      spl:
        type: SPL
      oracle_success:
        type: OracleSuccess
      oracle_navigation_error:
        type: OracleNavigationError
    actions:
      stop:
        type: StopAction
        agent_index: 0
      move_forward:
        type: MoveForwardAction
        agent_index: 0
      turn_left:
        type: TurnLeftAction
        agent_index: 0
      turn_right:
        type: TurnRightAction
        agent_index: 0
      look_up:
        type: LookUpAction
        agent_index: 0
      look_down:
        type: LookDownAction
        agent_index: 0

  dataset:
    type: R2RVLN-v1
    split: val_unseen
    scenes_dir: public_scenes/data/scene_data/public
    data_path: public_scenes/data/vln_ce/raw_data/public/{split}/{split}.json.gz

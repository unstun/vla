  <script>
    'use strict';
    const routes = JSON.parse(document.getElementById('route-data').textContent);
    const player = document.getElementById('player');
    const playlist = document.getElementById('playlist');
    const speed = document.getElementById('speed');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    const mediaError = document.getElementById('media-error');
    const positions = new Map();
    let current = -1;
    const clock = seconds => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2,'0')}`;
    const label = route => !route.arrived ? '未到达 · 已录段几何通过' : route.geometry ? '到达 · 采样几何通过' : '到达 · 固体越界';

    routes.forEach((route, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'route';
      button.dataset.case = route.id;
      button.setAttribute('aria-label', `${route.id}，${label(route)}，${clock(route.duration)}`);
      const thumbnail = document.createElement('img');
      thumbnail.src = route.poster;
      thumbnail.alt = '';
      const copy = document.createElement('span');
      copy.className = 'route-copy';
      const top = document.createElement('span');
      top.className = 'route-top';
      const id = document.createElement('span');
      id.className = 'route-id'; id.textContent = route.id;
      const duration = document.createElement('span');
      duration.className = 'duration'; duration.textContent = clock(route.duration);
      top.append(id, duration);
      const status = document.createElement('span');
      status.className = 'route-state' + (!route.arrived || !route.geometry ? ' issue' : '');
      status.textContent = label(route);
      copy.append(top, status); button.append(thumbnail, copy);
      button.addEventListener('click', () => selectRoute(index));
      playlist.append(button);
    });

    function selectRoute(index, forcePlay = false) {
      if (index < 0 || index >= routes.length || index === current) return;
      const wasPlaying = !player.paused && !player.ended;
      if (current >= 0 && Number.isFinite(player.currentTime)) positions.set(current, player.currentTime);
      player.pause();
      current = index;
      const route = routes[index];
      mediaError.hidden = true;
      player.poster = route.poster;
      player.src = route.file;
      player.setAttribute('aria-label', `${route.id} 完整实跑视频`);
      player.playbackRate = Number(speed.value);
      player.onloadedmetadata = () => {
        player.playbackRate = Number(speed.value);
        const saved = positions.get(index) || 0;
        if (saved > 0 && saved < player.duration - .5) player.currentTime = saved;
        if (wasPlaying || forcePlay) player.play().catch(() => {});
      };
      document.getElementById('case-title').textContent = route.id;
      const result = document.getElementById('case-result');
      result.textContent = label(route);
      result.className = 'result' + (!route.arrived || !route.geometry ? ' attention' : '');
      document.getElementById('case-note').textContent = route.note;
      document.getElementById('video-duration').textContent = clock(route.duration);
      document.getElementById('path-length').textContent = `${route.path.toFixed(2)} m`;
      const solid = document.getElementById('solid-margin');
      solid.textContent = `${route.solid >= 0 ? '+' : '−'}${Math.abs(route.solid * 100).toFixed(2)} cm`;
      solid.classList.toggle('negative', route.solid < 0);
      document.getElementById('support-margin').textContent = `+${(route.support * 100).toFixed(2)} cm`;
      document.getElementById('original').href = route.file;
      document.getElementById('position').textContent = `${String(index+1).padStart(2,'0')} / ${routes.length}`;
      previous.disabled = index === 0; next.disabled = index === routes.length-1;
      [...playlist.children].forEach((button, i) => button.setAttribute('aria-current', String(i === index)));
      history.replaceState(null, '', '#' + route.id);
    }
    previous.addEventListener('click', () => selectRoute(current-1));
    next.addEventListener('click', () => selectRoute(current+1));
    speed.addEventListener('change', () => { player.playbackRate = Number(speed.value); });
    player.addEventListener('error', () => { mediaError.hidden = false; });
    player.addEventListener('ended', () => {
      positions.delete(current);
      if (document.getElementById('autonext').checked) selectRoute(current+1, true);
    });
    window.addEventListener('hashchange', () => {
      const index = routes.findIndex(route => '#' + route.id === location.hash);
      if (index >= 0) selectRoute(index);
    });
    const initial = routes.findIndex(route => '#' + route.id === location.hash);
    selectRoute(initial < 0 ? 0 : initial);
  </script>
</body>
</html>

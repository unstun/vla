<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23191e21'/%3E%3Cpath d='M12 8v16l13-8z' fill='%2386d8c7'/%3E%3C/svg%3E">
  <title>v290 · 十条实跑回放</title>
  <style>
    :root { color-scheme:dark; --bg:#111416; --panel:#191e21; --line:#30383d; --text:#edf1f2; --muted:#99a6ad; --accent:#86d8c7; --bad:#f5b4a4; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    button,select { font:inherit; }
    button,a,select { -webkit-tap-highlight-color:transparent; }
    button,select { color:inherit; }
    button { cursor:pointer; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .shell { width:100%; max-width:1920px; margin:auto; padding:28px 36px 30px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:24px; padding-bottom:24px; }
    h1 { margin:0; font-size:25px; font-weight:600; letter-spacing:-.5px; }
    .version { color:var(--accent); font-variant-numeric:tabular-nums; }
    .subtitle { color:var(--muted); margin:4px 0 0; font-size:13px; }
    .summary { display:flex; gap:28px; margin:0; }
    .summary div { display:flex; flex-direction:column; }
    .summary dt { color:var(--muted); font-size:12px; }
    .summary dd { margin:0; font-size:23px; font-weight:550; font-variant-numeric:tabular-nums; }
    .summary small { color:var(--muted); font-size:14px; font-weight:400; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:24px; align-items:start; }
    .screen { background:#050708; aspect-ratio:16/9; position:relative; border-radius:9px; overflow:hidden; }
    video { width:100%; height:100%; display:block; object-fit:contain; }
    .error { position:absolute; top:20px; left:20px; right:20px; padding:12px 16px; background:#342723; color:var(--bad); border-radius:5px; }
    [hidden] { display:none!important; }
    .toolbar { display:flex; gap:14px; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .tools { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .control { border:1px solid var(--line); background:var(--panel); border-radius:5px; padding:5px 11px; min-height:35px; }
    .control:hover:not(:disabled) { background:#252d31; }
    button:disabled { opacity:.32; cursor:default; }
    .speed-label { color:var(--muted); font-size:13px; margin-left:4px; }
    select { background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:5px 8px; min-height:35px; }
    .autonext { display:flex; align-items:center; gap:5px; color:var(--muted); font-size:13px; cursor:pointer; }
    input[type=checkbox] { accent-color:var(--accent); width:15px; height:15px; }
    .original { font-size:13px; }
    .detail-head { display:flex; align-items:center; gap:12px; margin-top:20px; flex-wrap:wrap; }
    h2 { margin:0; font-size:25px; font-weight:550; line-height:1.3; }
    .result { font-size:13px; color:var(--accent); }
    .result.attention { color:var(--bad); }
    .case-note { margin:7px 0 18px; color:var(--muted); font-size:14px; }
    .facts { margin:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
    .facts dt { color:var(--muted); font-size:12px; }
    .facts dd { margin:3px 0 0; font-size:19px; font-variant-numeric:tabular-nums; }
    .negative { color:var(--bad); }
    aside { background:var(--panel); border:1px solid var(--line); border-radius:9px; overflow:hidden; }
    .list-head { padding:14px 16px 12px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
    .list-head h2 { font-size:14px; }
    .list-head span { color:var(--muted); font-size:12px; }
    #playlist { overflow-y:auto; max-height:590px; scrollbar-width:thin; scrollbar-color:#46535a transparent; }
    .route { display:flex; width:100%; border:0; background:transparent; text-align:left; padding:12px; gap:12px; align-items:center; border-left:3px solid transparent; }
    .route:hover { background:#242c30; }
    .route[aria-current=true] { background:#233832; border-left-color:var(--accent); }
    .route img { width:88px; aspect-ratio:16/9; object-fit:cover; border-radius:4px; }
    .route-copy { min-width:0; flex:1; }
    .route-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .route-id { font-size:15px; font-weight:600; }
    .duration { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
    .route-state { display:block; margin-top:2px; color:var(--muted); font-size:12px; }
    .route-state.issue { color:var(--bad); }
    footer { margin-top:25px; padding-top:17px; border-top:1px solid var(--line); display:flex; gap:20px; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--muted); }
    footer p { margin:0; max-width:920px; }
    .report { white-space:nowrap; }
    noscript { display:block; margin:20px 0; }
    @media(min-width:1600px) { #playlist { max-height:740px; } }
    @media(max-width:1050px) { .shell { padding:22px; } .layout { grid-template-columns:minmax(0,1fr) 280px; gap:18px; } .route img { width:72px; } .facts { grid-template-columns:repeat(2,1fr); } .summary { gap:20px; } }
    @media(max-width:760px) { .shell { padding:18px 14px; } header { align-items:flex-start; flex-direction:column; gap:14px; padding-bottom:18px; } h1 { font-size:22px; } .summary { width:100%; gap:0; justify-content:space-between; } .summary div { flex-direction:row; align-items:baseline; gap:9px; } .summary dd { font-size:20px; } .layout { display:flex; flex-direction:column; gap:24px; } .viewer,aside { width:100%; } #playlist { max-height:none; } .route img { width:100px; } .route { padding:11px; } .toolbar { gap:12px; } .tools { gap:8px; } .facts { gap:12px; } .case-note { margin-bottom:14px; } footer { flex-direction:column; gap:10px; } }
    @media(prefers-reduced-motion:no-preference) { .route,.control { transition:background .12s ease; } }
  </style>

  <script>
    'use strict';
    const routes = JSON.parse(document.getElementById('route-data').textContent);
    const player = document.getElementById('player');
    const playlist = document.getElementById('playlist');
    const speed = document.getElementById('speed');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    const mediaError = document.getElementById('media-error');
    const positions = new Map();
    let current = -1;
    const clock = seconds => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2,'0')}`;
    const label = route => route.deadline ? '未到达 · 扫描超时中断' : route.arrived ? (route.geometry ? '到达 · 采样几何通过' : '到达 · 几何越界') : (route.geometry ? '未到达 · 已录段几何通过' : '未到达 · 已录段几何越界');

    routes.forEach((route, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'route';
      button.dataset.case = route.id;
      button.setAttribute('aria-label', `${route.id}，${label(route)}，${clock(route.duration)}`);
      const thumbnail = document.createElement('img');
      thumbnail.src = route.poster;
      thumbnail.alt = '';
      const copy = document.createElement('span');
      copy.className = 'route-copy';
      const top = document.createElement('span');
      top.className = 'route-top';
      const id = document.createElement('span');
      id.className = 'route-id'; id.textContent = route.id;
      const duration = document.createElement('span');
      duration.className = 'duration'; duration.textContent = clock(route.duration);
      top.append(id, duration);
      const status = document.createElement('span');
      status.className = 'route-state' + (!route.arrived || !route.geometry ? ' issue' : '');
      status.textContent = label(route);
      copy.append(top, status); button.append(thumbnail, copy);
      button.addEventListener('click', () => selectRoute(index));
      playlist.append(button);
    });

    function selectRoute(index, forcePlay = false) {
      if (index < 0 || index >= routes.length || index === current) return;
      const wasPlaying = !player.paused && !player.ended;
      if (current >= 0 && Number.isFinite(player.currentTime)) positions.set(current, player.currentTime);
      player.pause();
      current = index;
      const route = routes[index];
      mediaError.hidden = true;
      player.poster = route.poster;
      player.src = route.file;
      player.setAttribute('aria-label', `${route.id} 完整实跑视频`);
      player.playbackRate = Number(speed.value);
      player.onloadedmetadata = () => {
        player.playbackRate = Number(speed.value);
        const saved = positions.get(index) || 0;
        if (saved > 0 && saved < player.duration - .5) player.currentTime = saved;
        if (wasPlaying || forcePlay) player.play().catch(() => {});
      };
      document.getElementById('case-title').textContent = route.id;
      const result = document.getElementById('case-result');
      result.textContent = label(route);
      result.className = 'result' + (!route.arrived || !route.geometry ? ' attention' : '');
      document.getElementById('case-note').textContent = route.note;
      document.getElementById('video-duration').textContent = clock(route.duration);
      document.getElementById('path-length').textContent = `${route.path.toFixed(2)} m`;
      const solid = document.getElementById('solid-margin');
      solid.textContent = `${route.solid >= 0 ? '+' : '−'}${Math.abs(route.solid * 100).toFixed(2)} cm`;
      solid.classList.toggle('negative', route.solid < 0);
      document.getElementById('support-margin').textContent = `${route.support >= 0 ? '+' : '−'}${Math.abs(route.support * 100).toFixed(2)} cm`; document.getElementById('support-margin').classList.toggle('negative', route.support < 0);
      document.getElementById('original').href = route.file;
      document.getElementById('position').textContent = `${String(index+1).padStart(2,'0')} / ${routes.length}`;
      previous.disabled = index === 0; next.disabled = index === routes.length-1;
      [...playlist.children].forEach((button, i) => button.setAttribute('aria-current', String(i === index)));
      history.replaceState(null, '', '#' + route.id);
    }
    previous.addEventListener('click', () => selectRoute(current-1));
    next.addEventListener('click', () => selectRoute(current+1));
    speed.addEventListener('change', () => { player.playbackRate = Number(speed.value); });
    player.addEventListener('error', () => { mediaError.hidden = false; });
    player.addEventListener('ended', () => {
      positions.delete(current);
      if (document.getElementById('autonext').checked) selectRoute(current+1, true);
    });
    window.addEventListener('hashchange', () => {
      const index = routes.findIndex(route => '#' + route.id === location.hash);
      if (index >= 0) selectRoute(index);
    });
    const initial = routes.findIndex(route => '#' + route.id === location.hash);
    selectRoute(initial < 0 ? 0 : initial);
  </script>
</body>
</html>

/nav2_internal/bt_navigator:
  ros__parameters:
    default_bt_xml_filename: /work/fixtures/component234.bt.xml
    enable_groot_monitoring: true
    global_frame: world
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    odom_topic: /quad_0/body_pose
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - lite3_nav2_route_bt
    robot_base_frame: base
    use_sim_time: false
/nav2_internal/bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: differential
    save_pose_rate: 0.5
    scan_topic: scan
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    use_sim_time: false
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
amcl_map_client:
  ros__parameters:
    use_sim_time: false
amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    SCAN:
      angular_acceleration: 2.0
      angular_deceleration: 3.0
      base_frame: base
      bspline_timeout: 5.0
      execution_max_age_seconds: 0.25
      execution_state_topic: /quad_0/execution_state
      expired_min_walk_speed: 0.2
      finish_dist: 0.02
      global_frame: world
      goal_xy_tolerance: 0.25
      goal_yaw_tolerance: 0.25
      goal_z_tolerance: 0.2
      heading_error_threshold: 1.0
      heading_resume_threshold: 0.6
      linear_acceleration: 1.0
      linear_deceleration: 2.0
      max_vx: 1.0
      max_vy: 0.35
      max_vyaw: 1.0
      native_planner_config: /work/fixtures/component234.scan.yaml
      native_worker_enabled: true
      plugin: scan_nav2_controller/Controller
      route_lookahead_dist: 0.5
      route_lookahead_heading_enabled: true
      route_topic: /pct_path
      stand_hold_seconds: 2.0
      stand_timeout_seconds: 10.0
      trajectory_starvation_timeout: 0.75
    controller_frequency: 30.0
    controller_plugins:
    - SCAN
    goal_checker_plugin: scan_goal_checker
    odom_topic: /quad_0/body_pose
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    progress_checker_plugin: progress_checker
    scan_goal_checker:
      controller_plugin: SCAN
      plugin: scan_nav2_controller/GoalChecker
    use_sim_time: false
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: world
      height: 1
      map_shell:
        enabled: false
        footprint_clearing_enabled: false
        observation_sources: ''
        plugin: nav2_costmap_2d::ObstacleLayer
      plugins:
      - map_shell
      publish_frequency: 0.0
      resolution: 1.0
      robot_base_frame: base
      robot_radius: 0.25
      rolling_window: true
      track_unknown_space: true
      update_frequency: 1.0
      use_sim_time: false
      width: 1
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: world
      height: 1
      map_shell:
        enabled: false
        footprint_clearing_enabled: false
        observation_sources: ''
        plugin: nav2_costmap_2d::ObstacleLayer
      plugins:
      - map_shell
      publish_frequency: 0.0
      resolution: 1.0
      robot_base_frame: base
      robot_radius: 0.25
      rolling_window: true
      track_unknown_space: true
      update_frequency: 1.0
      use_sim_time: false
      width: 1
planner_server:
  ros__parameters:
    PCT:
      map_bundle: /work/fixtures/building/route.pct
      max_heading_rate: 10.0
      odom_topic: /quad_0/body_pose
      plugin: lite3_nav2/PCTPlanner
      reference_height: 0.35
      shared_traversability: true
      use_quintic: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - PCT
    use_sim_time: false
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
recoveries_server:
  ros__parameters:
    global_frame: world
    recovery_plugins:
    - wait
    robot_base_frame: base
    use_sim_time: false
    wait:
      plugin: nav2_recoveries/Wait
robot_state_publisher:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    controller_plugins: [SCAN]
    progress_checker_plugin: progress_checker
    goal_checker_plugin: scan_goal_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    scan_goal_checker:
      plugin: scan_nav2_controller/GoalChecker
      controller_plugin: SCAN
    SCAN:
      plugin: scan_nav2_controller/Controller
      native_worker_enabled: true
      native_planner_config: ""  # Supplied explicitly by launch after resolving the pinned profile.
      global_frame: world
      base_frame: base_link
      route_topic: /pct_path
      bspline_timeout: 5.0
      execution_state_topic: /quad_0/execution_state
      stand_hold_seconds: 2.0
      stand_timeout_seconds: 10.0
      execution_max_age_seconds: 0.25
      goal_xy_tolerance: 0.25
      goal_z_tolerance: 0.20
      goal_yaw_tolerance: 0.25
      max_vx: 1.0
      max_vy: 0.35
      max_vyaw: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: world
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      update_frequency: 5.0
      publish_frequency: 1.0
      plugins: [inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer

    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
amcl_map_client:
  ros__parameters:
    use_sim_time: true
amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    SCAN:
      base_frame: base
      bspline_timeout: 5.0
      command_topic: /quad_0/cmd_vel
      finish_dist: 0.02
      global_frame: world
      goal_xy_tolerance: 0.25
      goal_yaw_tolerance: 0.25
      goal_z_tolerance: 0.2
      max_vx: 1.0
      max_vy: 0.35
      max_vyaw: 1.0
      native_planner_config: /private/tmp/vla_stop_audit_20261012/v194_overlay_preflight/runs/v194_overlay_graph_probe/planner.yaml
      native_worker_enabled: true
      plugin: scan_nav2_controller/Controller
      route_lookahead_dist: 0.5
      route_lookahead_heading_enabled: true
      route_topic: /pct_path
      spline_topic: /quad_0/planning/bspline
    controller_frequency: 30.0
    controller_plugins:
    - SCAN
    goal_checker_plugin: scan_goal_checker
    odom_topic: /quad_0/body_pose
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    progress_checker_plugin: progress_checker
    scan_goal_checker:
      controller_plugin: SCAN
      plugin: scan_nav2_controller/GoalChecker
    use_sim_time: true
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: world
      height: 6
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - terrain_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.1
      robot_base_frame: base
      robot_radius: 0.25
      rolling_window: true
      terrain_layer:
        base_frame: base
        plugin: lite3_nav2/TerrainLayer
      track_unknown_space: true
      update_frequency: 10.0
      use_sim_time: true
      width: 6
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: world
      height: 6
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.4

      plugins:
      - terrain_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.1
      robot_base_frame: base
      robot_radius: 0.25
      rolling_window: true
      terrain_layer:
        base_frame: base
        plugin: lite3_nav2/TerrainLayer
      track_unknown_space: true
      update_frequency: 10.0
      use_sim_time: true
      width: 6

# Component profile. No hardware sender is launched. Requires the pinned Foxy
# ControllerServer output/stop adaptation; stock Foxy loses P2B command identity.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    controller_plugins: [SCAN]
    progress_checker_plugin: progress_checker
    goal_checker_plugin: scan_goal_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    scan_goal_checker:
      plugin: scan_nav2_controller/GoalChecker
      controller_plugin: SCAN
    SCAN:
      plugin: scan_nav2_controller/Controller
      native_worker_enabled: false
      native_planner_config: ""  # Supplied explicitly by launch after resolving the pinned profile.
      global_frame: world
      base_frame: base_link
      binding_topic: /nav2_scan/route_binding
      route_topic: /p2b/route
      cancel_topic: /p2b/scan_cancel
      spline_topic: /quad_0/planning/bspline
      safety_topic: /quad_0/planning/execution_safety
      stop_evidence_topic: /nav2_scan/stop_evidence
      command_topic: /quad_0/raw_scan_cmd_vel
      goal_xy_tolerance: 0.25
      goal_z_tolerance: 0.20
      goal_yaw_tolerance: 0.25
      max_vx: 1.0
      max_vy: 0.35
      max_vyaw: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: world
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      update_frequency: 5.0
      publish_frequency: 1.0
      plugins: [inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
# This costmap supplies Nav2 frame/pose plumbing. It is not the SCAN 3D collision
# oracle. Native SCAN safety evidence remains mandatory for nonzero output.

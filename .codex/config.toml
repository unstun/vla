# Project defaults. Global MCP and feature settings remain user-owned.
project_doc_max_bytes = 65536
project_doc_fallback_filenames = ["AGENTS.md"]

# Limits apply only when Dr Sun explicitly requests subagents.
[agents]
max_threads = 6
max_depth = 1

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
GIT_AUTHOR_EMAIL = "codex@vla.local"
GIT_AUTHOR_NAME = "Codex"

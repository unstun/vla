// ---------------------------------------------------------------- math utils
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;

const ease = u => (u = clamp(u), u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const eout = u => (u = clamp(u), 1 - Math.pow(1 - u, 3));
const ramp = (t, a, b) => ease((t - a) / (b - a));
const fade = (t, a, b, c = 1e9, d = 1e9) => Math.min(ramp(t, a, b), 1 - ramp(t, c, d));
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]], add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const mul = (a, s) => [a[0] * s, a[1] * s], dot = (a, b) => a[0] * b[0] + a[1] * b[1];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DPR = 1, CW = 0, CH = 0, S = 1, OX = 0, OY = 0;
function resize() {

}

const VX0 = () => -OX / S, VX1 = () => (CW - OX) / S, VY0 = () => -OY / S, VY1 = () => (CH - OY) / S;

// ---------------------------------------------------------------- camera choreography
const CAM = [
  [0,    24.0, 15.2, 42], [4.5,  24.0, 15.2, 42],
  [6.2,  28.2, 14.8, 38], [48.2, 28.2, 14.8, 38],
  [50.2, 17.2, 17.8, 76], [60.8, 17.2, 17.8, 76],
  [62.8, 28.2, 14.8, 38], [86.0, 28.2, 14.8, 38],
];
let cam = { x: 24.0, y: 15.2, k: 42 };
function camAt(t) {
  let i = 0; while (i < CAM.length - 1 && CAM[i + 1][0] <= t) i++;
  if (i >= CAM.length - 1) { const c = CAM[CAM.length - 1]; return { x: c[1], y: c[2], k: c[3] }; }
  const a = CAM[i], b = CAM[i + 1], u = ease((t - a[0]) / (b[0] - a[0]));
  return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), k: Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), u)) };
}
const X = x => 960 + (x - cam.x) * cam.k;
const Y = y => 540 - (y - cam.y) * cam.k;
const P2 = p => [X(p[0]), Y(p[1])];

// ---------------------------------------------------------------- rich text & pills
function layoutRich(s, size, weight) {
  const runs = []; let mode = 'txt', buf = '';
  const push = (text, font, dy) => { ctx.font = font; runs.push({ text, font, dy, w: ctx.measureText(text).width }); };
  const flush = () => { if (buf) { push(buf, mode === 'code' ? `${size * 0.86}px ${MONO}` : `${weight} ${size}px ${SANS}`, 0); buf = ''; } };
  for (let i = 0; i < s.length;) {
    const c = s[i];
    if (c === '`') { flush(); mode = mode === 'code' ? 'txt' : 'code'; i++; continue; }
    if (c === '$' && mode !== 'code') { flush(); mode = mode === 'math' ? 'txt' : 'math'; i++; continue; }
    if (mode !== 'math') { buf += c; i++; continue; }
    if (c === '\\') {
      let cmd = ''; i++; while (i < s.length && /[a-zA-Z]/.test(s[i])) cmd += s[i++];
      const map = { max: 'max', min: 'min', Delta: 'Δ', lambda: 'λ', le: '≤', ge: '≥', cdot: '·', times: '×', dots: '…' };
      if (cmd === 'hat') {
        if (s[i] === '{') { i++; let inner = ''; while (i < s.length && s[i] !== '}') inner += s[i++]; i++; push(inner + '\u0302', `italic ${size * 1.1}px ${SERIF}`, 0); }
        continue;
      }
      if (cmd === 'text') {
        if (s[i] === '{') { i++; let inner = ''; while (i < s.length && s[i] !== '}') inner += s[i++]; i++; push(inner, `${weight} ${size * 0.92}px ${SANS}`, 0); }
        continue;
      }
      if (cmd in map && map[cmd]) push(map[cmd], `${size * 1.05}px ${SERIF}`, 0);
      continue;
    }
    if (c === '_' || c === '^') {
      let t = ''; i++;
      if (s[i] === '{') { i++; while (i < s.length && s[i] !== '}') t += s[i++]; i++; } else t = s[i++];
      const ss = size * 0.68, dy = c === '_' ? size * 0.26 : -size * 0.42;
      const it = t.length === 1 && /[a-zA-Zα-ω]/.test(t);
      push(t, `${it ? 'italic ' : ''}${ss * 1.06}px ${SERIF}`, dy); continue;
    }
    if (c === ' ') { runs.push({ text: '', font: '', dy: 0, w: size * 0.22 }); i++; continue; }
    if (/[a-zA-Zα-ω]/.test(c)) push(c, `italic ${size * 1.1}px ${SERIF}`, 0);
    else if (/[\u3000-\u9fff\uff00-\uffef]/.test(c)) push(c, `${weight} ${size}px ${SANS}`, 0);
    else push(c, `${size * 1.1}px ${SERIF}`, 0);
    i++;
  }
  flush(); return runs;
}
function richWidth(s, size, weight = 400) { return layoutRich(s, size, weight).reduce((a, r) => a + r.w, 0); }
function drawRich(s, x, y, size, color, align = 'left', weight = 400) {
  const runs = layoutRich(s, size, weight), w = runs.reduce((a, r) => a + r.w, 0);
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.fillStyle = color; ctx.textBaseline = 'alphabetic';
  for (const r of runs) { if (r.text) { ctx.font = r.font; ctx.fillText(r.text, cx, y + r.dy); } cx += r.w; }
  return w;
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function pill(s, ax, ay, o) {
  o = Object.assign({ dx: 0, dy: 0, al: 'c', size: 18, color: C.ink, edge: 'rgba(255,255,255,0.18)', a: 1, lead: false }, o);
  if (o.a <= 0.01) return;

  const w = richWidth(s, o.size), h = o.size * 1.65, px = 11;
  let x = ax + o.dx, y = ay + o.dy;
  const bx = o.al === 'c' ? x - w / 2 - px : o.al === 'r' ? x - w - 2 * px : x;
  if (o.lead) {
    ctx.strokeStyle = o.edge; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(bx + (o.al === 'r' ? w + 2 * px : o.al === 'l' ? 0 : w / 2 + px), y); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(9,12,17,0.84)'; ctx.strokeStyle = o.edge; ctx.lineWidth = 1;
  rrect(bx, y - h / 2, w + 2 * px, h, h / 2); ctx.fill(); ctx.stroke();
  drawRich(s, bx + px, y + o.size * 0.36, o.size, o.color);
  ctx.restore();
}

// ---------------------------------------------------------------- primitives
function wline(a, b, color, w = 2, dash = null, alpha = 1) {
  if (alpha <= 0.01) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(X(a[0]), Y(a[1])); ctx.lineTo(X(b[0]), Y(b[1])); ctx.stroke(); ctx.restore();
}
function wpoly(pts, color, w = 2, dash = null, alpha = 1, upto = 1) {
  if (alpha <= 0.01 || upto <= 0) return;
  const n = Math.max(2, Math.floor(pts.length * upto));
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
  for (let i = 1; i < n && i < pts.length; i++) ctx.lineTo(X(pts[i][0]), Y(pts[i][1]));
  ctx.stroke(); ctx.restore();
}
function warrow(a, b, color, w = 2.5, alpha = 1, head = 12, dash = null) {
  if (alpha <= 0.01) return;
  const A = P2(a), B = P2(b), d = [B[0] - A[0], B[1] - A[1]], L = Math.hypot(d[0], d[1]);
  if (L < 2) return;
  const u = [d[0] / L, d[1] / L], hh = Math.min(head, L * 0.45);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0] - u[0] * hh * 0.8, B[1] - u[1] * hh * 0.8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(B[0], B[1]);
  ctx.lineTo(B[0] - u[0] * hh - u[1] * hh * 0.45, B[1] - u[1] * hh + u[0] * hh * 0.45);
  ctx.lineTo(B[0] - u[0] * hh + u[1] * hh * 0.45, B[1] - u[1] * hh - u[0] * hh * 0.45);

}
function wdot(p, r, fill, stroke = null, alpha = 1, lw = 2) {
  if (alpha <= 0.01) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  ctx.restore();
}
function halo(p, r, color, alpha) {
  if (alpha <= 0.01) return;
  const x = X(p[0]), y = Y(p[1]); const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function cellRect(i, j, fill, alpha = 1) {
  if (alpha <= 0.01) return;
  const x0 = X(i), y0 = Y(j + 1), s = cam.k;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = fill; ctx.fillRect(x0 - 0.5, y0 - 0.5, s + 1, s + 1); ctx.restore();
}
function wEllipse(center, v, rxWorld, ryWorld, strokeColor, fillColor, alpha = 1, lw = 1.8, dash = null) {
  if (alpha <= 0.01) return;
  const [cx, cy] = P2(center);
  const ang = Math.atan2(-v[1], v[0]); // screen Y is inverted
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.translate(cx, cy); ctx.rotate(ang);
  ctx.beginPath(); ctx.ellipse(0, 0, rxWorld * cam.k, ryWorld * cam.k, 0, 0, Math.PI * 2);
  if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
  if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = lw; if (dash) ctx.setLineDash(dash); ctx.stroke(); }
  ctx.restore();
}

// ---------------------------------------------------------------- obstacle edges
function edgesOf(grid) {
  const E = [];
  for (let i = 0; i < G.W; i++) for (let j = 0; j < G.H; j++) {
    if (!grid[i][j]) continue;
    const f = (a, b) => a < 0 || b < 0 || a >= G.W || b >= G.H || !grid[a][b];
    if (f(i - 1, j)) E.push([i, j, i, j + 1]); if (f(i + 1, j)) E.push([i + 1, j, i + 1, j + 1]);
    if (f(i, j - 1)) E.push([i, j, i + 1, j]); if (f(i, j + 1)) E.push([i, j + 1, i + 1, j + 1]);
  }
  return E;
}
const RAW_E = edgesOf(G.raw), INF_E = edgesOf(G.infl);
function strokeEdges(E, color, w, dash, alpha) {
  if (alpha <= 0.01) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = w; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); for (const e of E) { ctx.moveTo(X(e[0]), Y(e[1])); ctx.lineTo(X(e[2]), Y(e[3])); } ctx.stroke(); ctx.restore();
}

function drawBackdrop() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, CW, CH);
  const g = ctx.createRadialGradient(CW * 0.45, CH * 0.40, 0, CW * 0.45, CH * 0.40, Math.max(CW, CH) * 0.75);
  g.addColorStop(0, 'rgba(40,56,78,0.28)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
}

  const y0 = Math.floor(cam.y - (VY1() - 540) / cam.k) - 1, y1 = Math.ceil(cam.y - (VY0() - 540) / cam.k) + 1;
  const a = 0.032 + 0.032 * clamp((cam.k - 38) / 50);
  ctx.save(); ctx.lineWidth = 1;
  for (let pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass ? `rgba(170,190,220,${a + 0.032})` : `rgba(170,190,220,${a})`;
    ctx.beginPath();
    for (let x = x0; x <= x1; x++) if ((x % 6 === 0) === !!pass) { ctx.moveTo(X(x), VY0()); ctx.lineTo(X(x), VY1()); }
    for (let y = y0; y <= y1; y++) if ((y % 6 === 0) === !!pass) { ctx.moveTo(VX0(), Y(y)); ctx.lineTo(VX1(), Y(y)); }
    ctx.stroke();
  }
  ctx.restore();
}
function drawObstacle(t) {
  const a = ramp(t, 0.1, 0.9);
  for (let i = 0; i < G.W; i++) for (let j = 0; j < G.H; j++) {

// ---------------------------------------------------------------- dynamic control points Q(t)
const REPARAM_T0 = 33.2, REPARAM_T1 = 36.8;
const REFINE_T0 = 62.6, REFINE_T1 = 71.8;
const HCUM = (() => {
  const H = G.refined.hist, c = [0];
  for (let i = 1; i < H.length; i++) {
    let m = 0; for (let k = 0; k < NQ; k++) m = Math.max(m, Math.hypot(H[i][k][0] - H[i - 1][k][0], H[i][k][1] - H[i - 1][k][1]));
    c.push(c[i - 1] + m);
  }
  return c.map(v => v / (c[c.length - 1] || 1));
})();
function Qat(t) {
  if (t < REPARAM_T0) return G.Qreb;
  if (t < REFINE_T0) {
    const u = ease((t - REPARAM_T0) / (REPARAM_T1 - REPARAM_T0));
    return G.Qreb.map((q, k) => lerp2(q, G.Qreparam[k], u));
  }
  const H = G.refined.hist, u = ease((t - REFINE_T0) / (REFINE_T1 - REFINE_T0));
  let i = 0; while (i < H.length - 2 && HCUM[i + 1] <= u) i++;
  const r = clamp((u - HCUM[i]) / Math.max(1e-9, HCUM[i + 1] - HCUM[i]));
  return H[i].map((q, k) => lerp2(q, H[i + 1][k], r));
}

// ---------------------------------------------------------------- overlay 2: Kinematic Profile Panel (|v_d(t)| & |a_d(t)|)
function drawKinematicPanel(t) {
  const a = fade(t, 6.2, 7.2, 85.2, 86.0) * (1 - fade(t, 48.6, 49.6, 61.0, 62.0));
  if (a <= 0.01) return;
  const x0 = 1340, y0 = 96, w = 490, h = 440;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = 'rgba(9,12,17,0.88)'; ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
  rrect(x0, y0, w, h, 16); ctx.fill(); ctx.stroke();

  // Blend active profile according to current stage
  const uStretch = ramp(t, 18.8, 23.6);
  const uReparam = ramp(t, REPARAM_T0, REPARAM_T1);
  const uRefine  = ramp(t, REFINE_T0, REFINE_T1);

  const stageTag = t < 18.5 ? 'Rebound 初始 ($t_s=0.50$ s)' :
                   t < REPARAM_T0 ? '`lengthenTime` 非均匀拉长' :
                   t < REFINE_T0 ? '`reparamBspline` 均匀重参数化' : '`BsplineOptimizeTrajRefine` 精炼后';
  drawRich('动力学包络监控', x0 + 22, y0 + 32, 17, C.ink, 'left', 600);
  drawRich(stageTag, x0 + w - 22, y0 + 32, 14.5, uRefine > 0.8 ? C.base : C.guide, 'right');

  const nPts = G.prof0.pts.length;
  const dur = lerp(G.duration0, G.duration1, uStretch);
  const maxT = 5.0; // fixed time axis max so stretching 4.00s -> 4.75s is visually obvious!

  function drawSubChart(cy0, ch, title, limitVal, maxVal, getter, unitLabel) {
    const padL = 54, padR = 24, cw = w - padL - padR;
    const tx = time => x0 + padL + (time / maxT) * cw;
    const vy = val => cy0 + ch - 26 - clamp(val / maxVal, 0, 1.08) * (ch - 48);

    // Axes
    ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tx(0), vy(0)); ctx.lineTo(tx(maxT), vy(0));
    ctx.moveTo(tx(0), vy(0)); ctx.lineTo(tx(0), cy0 + 16); ctx.stroke();

    // Limit line
    const ly = vy(limitVal);
    ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(245,210,107,0.75)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(tx(0), ly); ctx.lineTo(tx(maxT), ly); ctx.stroke(); ctx.restore();
    drawRich(`${unitLabel} = ${limitVal.toFixed(1)}`, tx(maxT) - 4, ly - 7, 14, C.safe, 'right');
    drawRich(title, x0 + 18, cy0 + 22, 15, C.dim);

    // Faint reference curve from initial Rebound
    if (uStretch > 0.05) {
      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.setLineDash([3, 4]); ctx.lineWidth = 1.3;
      ctx.beginPath();
      G.prof0.pts.forEach((p, k) => {
        const px = tx(p.t), py = vy(getter(p));
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      });
      ctx.stroke(); ctx.restore();
    }

    // Current blended curve, colored red above limitVal and green/gold below
    let peak = 0;
    const curPts = [];
    for (let k = 0; k < nPts; k++) {
      const v0 = getter(G.prof0.pts[k]);
      const vL = getter(G.profNonUni.pts[k]);
      const vR = getter(G.profReparam.pts[k]);
      const vF = getter(G.profRef.pts[k]);
      let v = lerp(v0, vL, uStretch);
      v = lerp(v, vR, uReparam);
      v = lerp(v, vF, uRefine);
      if (v > peak) peak = v;
      const tk = dur * k / (nPts - 1);
      curPts.push({ x: tx(tk), y: vy(v), over: v > limitVal + 0.02 });
    }

    // Fill red overshoot area above limitVal
    ctx.save();
    ctx.beginPath();
    ctx.rect(tx(0), cy0, cw, ly - cy0);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,107,94,0.22)';
    ctx.beginPath(); ctx.moveTo(curPts[0].x, ly);
    curPts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(curPts[curPts.length - 1].x, ly); ctx.closePath(); ctx.fill();
    ctx.restore();

    // Draw curve segments
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let k = 0; k < curPts.length - 1; k++) {
      ctx.strokeStyle = (curPts[k].over || curPts[k + 1].over) ? C.hit : (uRefine > 0.8 ? C.base : C.traj);
      ctx.beginPath(); ctx.moveTo(curPts[k].x, curPts[k].y); ctx.lineTo(curPts[k + 1].x, curPts[k + 1].y); ctx.stroke();
    }

    // Peak badge
    const isOver = peak > limitVal + 0.02;
    drawRich(`峰值 ${peak.toFixed(2)} ${isOver ? '> 限值 ✕' : '≤ 限值 ✓'}`, x0 + w - 125, cy0 + 22, 14, isOver ? C.hit : C.base, 'right', 600);

    // Time ticks on bottom chart
    [0, 2.0, 4.0, 4.75].forEach(tv => {
      const xk = tx(tv);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.moveTo(xk, vy(0)); ctx.lineTo(xk, vy(0) + 4); ctx.stroke();
      drawRich(`${tv.toFixed(tv === 4.75 ? 2 : 1)}s`, xk, vy(0) + 18, 13, tv === 4.75 && uStretch > 0.3 ? C.guide : C.dim, 'center');
    });
  }

  drawSubChart(y0 + 48, 184, '轴向速度 $|v_d(t)|$', G.limitVel, 15.5, p => p.vmaxAxis, '$v_{max}$');
  drawSubChart(y0 + 242, 184, '轴向加速度 $|a_d(t)|$', G.limitAcc, 24.0, p => p.amaxAxis, '$a_{max}$');
  ctx.restore();
}

  } else {

    if (t >= REPARAM_T0) wpoly(curveReb, C.traj, 1.6, [5, 6], 0.28 * (1 - 0.5 * macro));
    const col = t >= REFINE_T1 - 0.5 ? C.base : C.traj;
    wpoly(curCurve, col, 3.4, null, 1 - 0.25 * macro);
    if (t >= REFINE_T1 - 0.5) {

      { a: fade(t, 33.4, 34.0, 38.6, 39.3), dy: -28, size: 18, color: C.guide, edge: 'rgba(69,211,196,0.5)' });
  }

  // 5. Act 4 (39.5 - 48.5s): Residual violation on Q_reparam & sampling `ref_pts_`
  if (t >= 39.5 && t < 48.6) {
    const ra = fade(t, 40.0, 40.8, 48.0, 48.6);
    warrow(G.Qreparam[2], G.Qreparam[3], C.hit, 3.2, ra, 13);
    warrow(G.Qreparam[7], G.Qreparam[8], C.hit, 3.2, ra, 13);
    pill('残余超限 $|V_3| = 12.84 > 10.5$, $|A_2| = 14.58 > 13.5$', ...P2(lerp2(G.Qreparam[2], G.Qreparam[3], 0.5)),
      { a: ra, al: 'r', dx: -20, dy: -16, size: 17, color: C.hit, edge: 'rgba(255,107,94,0.55)' });

    const refA = fade(t, 43.5, 44.3, 48.0, 48.6);
    G.refPts.forEach(rp => wdot(rp, 5.5, '#0b1016', C.guide, refA, 2.2));
    pill('安全几何参考点 $R_k =$ `ref_pts_`', X(24.0), Y(25.2),
      { a: refA, dy: -28, size: 18, color: C.guide, edge: 'rgba(69,211,196,0.5)' });
  }

  // 6. Act 5 (48.5 - 61.5s): Macro Zoom on Anisotropic 5:1 Fitness Ellipse (calcFitnessCost)
  if (t >= 48.5 && t < 62.5) {
    const fa = fade(t, 49.4, 50.2, 61.0, 61.8);
    const R3 = FIT_HERO.ref, v = FIT_HERO.v, n = FIT_HERO.n;
    wEllipse(R3, v, 2.75, 0.55, C.guide, 'rgba(69,211,196,0.12)', fa, 2.2, null);
    wEllipse(R3, v, 1.65, 0.33, 'rgba(69,211,196,0.45)', null, fa, 1.3, [5, 5]);

    warrow(R3, add(R3, mul(v, 2.75)), C.guide, 2.4, fa, 12);
    warrow(R3, add(R3, mul(n, 1.15)), C.hit, 2.2, fa, 11);
    pill('切向 $v$ （$a^2=25$，允许沿轨迹滑动调速）', ...P2(add(R3, mul(v, 2.75))),
      { a: fa, al: 'l', dx: 16, dy: -6, size: 18, color: C.guide, edge: 'rgba(69,211,196,0.5)' });
    pill('法向 $n$ （$b^2=1$，刚度 25 倍，严禁偏离撞障）', ...P2(add(R3, mul(n, 1.15))),
      { a: fa, al: 'r', dx: -16, dy: -12, size: 18, color: C.hit, edge: 'rgba(255,107,94,0.5)' });

    const slideU = ramp(t, 53.5, 58.5);
    const pHatCur = lerp2(FIT_HERO.pHatRep, FIT_HERO.pHatRef, slideU);
    const q3 = lerp2(G.Qreparam[2], G.Qref[2], slideU);
    const q4 = lerp2(G.Qreparam[3], G.Qref[3], slideU);
    const q5 = lerp2(G.Qreparam[4], G.Qref[4], slideU);
    [q3, q4, q5].forEach(qk => wline(qk, pHatCur, 'rgba(245,210,107,0.45)', 1.3, [4, 4], fa));

    const dx = sub(pHatCur, R3);
    const projV = add(R3, mul(v, dot(dx, v)));
    if (slideU > 0.05) {
      wline(R3, projV, C.safe, 2.8, null, fa);
      wline(projV, pHatCur, C.hit, 2.2, [3, 3], fa);
      warrow(R3, pHatCur, C.safe, 2.4, fa, 11);
    }
    wdot(R3, 6.5, '#0b1016', C.guide, fa, 2.4);
    pill('$R_3 =$ `ref_pts_[2]`', ...P2(R3), { a: fa, al: 'l', dx: 20, dy: 28, size: 18, color: C.guide });
    wdot(pHatCur, 7.5, C.safe, '#0b1016', fa, 2.2);
    pill(`$\\hat{P}_4 = (Q_3+4Q_4+Q_5)/6$   切向滑移 $x·v = ${(dot(dx, v)).toFixed(2)}$`, ...P2(pHatCur),
      { a: fa, al: 'r', dx: -18, dy: 24, size: 18, color: C.safe, edge: 'rgba(245,210,107,0.55)' });
  }

  // 7. Act 6 (61.5 - 74.5s): Full-trajectory Refine optimization with all 5:1 ellipses
  if (t >= 61.5 && t < 74.5) {
    const ea = fade(t, 61.8, 62.5, 73.2, 74.2);
    G.fitnessItems.forEach((f, idx) => {
      if (idx === 0 || idx === G.fitnessItems.length - 1) return;
      wEllipse(f.ref, f.v, 2.1, 0.42, 'rgba(69,211,196,0.65)', 'rgba(69,211,196,0.10)', ea, 1.5);
      wdot(f.ref, 4.0, C.guide, null, ea * 0.8);
      const pHat = [
        (Q[f.i - 1][0] + 4 * Q[f.i][0] + Q[f.i + 1][0]) / 6,
        (Q[f.i - 1][1] + 4 * Q[f.i][1] + Q[f.i + 1][1]) / 6
      ];
      wdot(pHat, 5.2, C.safe, '#0b1016', ea, 1.6);
    });
  }

  // 8. Act 7 (74.5 - 86.0s): Dense dynamic feasibility check sweep (`checkDynamicFeasibility`)
  if (t >= 74.5) {
    const sweepU = clamp((t - 75.0) / 3.8);
    const nSweep = Math.floor(sweepU * (curveRef.length - 1));
    const sa = fade(t, 74.6, 75.2, 85.5, 86.0);
    for (let k = 0; k <= nSweep; k += 3) {
      wdot(curveRef[k], 3.2, C.base, null, sa * 0.85);
    }
    if (sweepU < 1.0) {
      const pt = curveRef[nSweep];
      halo(pt, 28, 'rgba(126,224,138,0.55)', sa);
      wdot(pt, 7, C.base, '#0b1016', sa, 2);
    }
    pill('✓ `checkDynamicFeasibility` 通过：全程无碰撞且 $|v_d| ≤ 8.69$, $|a_d| ≤ 11.05$', X(22.0), Y(25.2),
      { a: ramp(t, 78.8, 79.6), dy: -28, size: 18, color: C.base, edge: 'rgba(126,224,138,0.55)' });
  }

  // 9. Draw Control Points Q_1 .. Q_11
  for (let k = 0; k < NQ; k++) {
    const isFixed = k < 3 || k >= NQ - 3;
    const r = clamp(cam.k * 0.13, 5.5, 9.5);
    let fill = '#0b1016', stroke = C.ink;
    if (t >= REFINE_T0 && isFixed) { stroke = C.free; }
    else if (t >= REFINE_T1 - 0.3) { fill = C.base; stroke = '#0b1016'; }
    else if (t >= REPARAM_T0 && !isFixed) { fill = C.safe; stroke = '#0b1016'; }
    let a = 1.0;
    if (macro > 0 && (k < 2 || k > 5)) a *= 1 - 0.65 * macro;
    wdot(Q[k], r, fill, stroke, a, 2.2);
    const showLbl = macro > 0.3 ? (k === 3 || k === 4) : (k === 2 || k === 3 || k === 5 || k === 7 || k === 8 || (k === 10 && t < 5.5));
    if (showLbl) {
      const al = (macro > 0.3 && k === 3) ? 'l' : (k === 7 ? 'r' : 'c');
      const dx = (macro > 0.3 && k === 3) ? 18 : (k === 7 ? -16 : 0);
      const dy = (macro > 0.3 && k === 3) ? -22 : (k === 5 ? 32 : (k === 7 ? 18 : (k >= 3 && k <= 7 ? -26 : 28)));
      pill(`$Q_{${k + 1}}$`, ...P2(Q[k]), { a: a * 0.92, al, dx, dy, size: 16, color: C.ink });
    }
  }

  // Overlays & HUD
  drawKnotTrack(t);
  drawKinematicPanel(t);
  drawCaption(t);
  drawChrome(t);
}

// ---------------------------------------------------------------- playback
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) { T += dt; if (T >= T_END) { T = T_END; paused = true; } }
  hintA = clamp(1 - (now - lastMove - 2500) / 600);
  draw(T); requestAnimationFrame(frame);
}
window.setFilmTime = t => { T = clamp(t, 0, T_END); paused = true; draw(T); return T; };
window.play = () => { paused = false; };
addEventListener('keydown', e => {
  if (e.code === 'Space') { if (T >= T_END) T = 0; paused = !paused; e.preventDefault(); }
  else if (e.code === 'ArrowRight') { const i = actIndex(T); T = ACTS[Math.min(ACTS.length - 1, i + 1)].t0 + 0.01; }
  else if (e.code === 'ArrowLeft') { const i = actIndex(T); T = ACTS[Math.max(0, T - ACTS[i].t0 < 1 ? i - 1 : i)].t0 + 0.01; }
  else if (e.key === 'r') { T = 0; paused = false; }
  lastMove = performance.now();
});
addEventListener('mousemove', e => { lastMove = performance.now(); hoverBar = e.clientY > CH - 26; cv.style.cursor = hoverBar ? 'pointer' : 'default'; });
addEventListener('mousedown', e => { if (e.clientY > CH - 26) { T = clamp(e.clientX / CW) * T_END; } else { if (T >= T_END) T = 0; paused = !paused; } });
requestAnimationFrame(frame);
</script>
